services:
  postgres:
    image: postgres:16
    container_name: jetguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jetguard
      POSTGRES_USER: jetguard
      POSTGRES_PASSWORD: jetguard_password
    ports:
      - "5432:5432"
    volumes:
      - jetguard_postgres_data:/var/lib/postgresql/data

volumes:
  jetguard_postgres_data:
