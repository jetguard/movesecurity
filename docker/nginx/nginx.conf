user nginx;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    # Headers de segurança (valem para todo server{} abaixo)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream backend {
        server 127.0.0.1:3000 max_fails=5 fail_timeout=5s;
    }

    # Porta 80: só o health check responde direto (para o probe do
    # Kubernetes não precisar lidar com HTTPS); todo o resto vai para HTTPS.
    server {
        listen 80;
        server_name movesecurity.movecta.com.br movesecurity-dev.movecta.com.br;

        location = /api/health {
            proxy_pass http://backend/api/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name movesecurity.movecta.com.br movesecurity-dev.movecta.com.br;

        ssl_certificate         /etc/nginx/certs/tls.crt;
        ssl_certificate_key     /etc/nginx/certs/tls.key;
        ssl_trusted_certificate /etc/nginx/certs/ca.crt;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;

        # Alinhado com UPLOAD_MAX_FILE_SIZE (10MB) do backend; ajuste os dois
        # juntos se o limite de upload mudar.
        client_max_body_size 10m;

        root /var/www/html;
        index index.html;

        access_log /var/log/nginx/movesecurity-access.log;
        error_log  /var/log/nginx/movesecurity-error.log;

        location ~ /\. {
            deny all;
        }

        # Arquivos estáticos do build do Vite (hash no nome do arquivo).
        location ~* \.(?:css|js|svg|gif|jpe?g|png|webp|woff2?)$ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /uploads {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (backend/src/services/realtime.service.ts)
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # SPA React: fallback de rota client-side.
        location / {
            try_files $uri /index.html;
        }
    }
}
