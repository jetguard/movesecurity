apiVersion: v1
kind: Namespace
metadata:
  name: movesecurity-prod

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: movesecurity-prod
  namespace: movesecurity-prod
spec:
  selector:
    matchLabels:
      app: movesecurity-prod
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: movesecurity-prod
    spec:
      securityContext:
        # GID do usuário "movesecurity" criado na imagem (ver Dockerfile) -
        # garante que o volume de uploads montado abaixo seja gravável por
        # ele, mesmo sendo um PVC provisionado com dono root por padrão.
        fsGroup: 10001
      initContainers:
        - name: seed-uploads
          image: gru.ocir.io/grs61s2n1sbr/movesecurity-prod:latest
          imagePullPolicy: Always
          # Semeia o vídeo fixo de treinamento no PVC de uploads, caso ainda
          # não esteja lá (não sobrescreve se já existir). O publish-prod.sh
          # atualiza a tag desta imagem junto com a do container principal,
          # então ela nunca fica presa numa tag antiga que seja limpa do OCIR.
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/backend/uploads/treinamentos-dinamicos/videos
              if [ ! -f /app/backend/uploads/treinamentos-dinamicos/videos/treinamento_terminal_rfb.mp4 ]; then
                cp /app/seed/treinamentos-dinamicos/videos/treinamento_terminal_rfb.mp4 /app/backend/uploads/treinamentos-dinamicos/videos/treinamento_terminal_rfb.mp4
              fi
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
      containers:
        - name: movesecurity-prod
          image: gru.ocir.io/grs61s2n1sbr/movesecurity-prod:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 443
            - containerPort: 80
          envFrom:
            - secretRef:
                name: movesecurity-secrets
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
            - name: ssl-certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: movesecurity-uploads-prod
        - name: ssl-certs
          secret:
            secretName: ca-certificate-secret-movesecurity
      imagePullSecrets:
        - name: ocir-pull-movesecurity

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movesecurity-uploads-prod
  namespace: movesecurity-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 20Gi

---

apiVersion: v1
kind: Service
metadata:
  name: svc-movesecurity-prod
  namespace: movesecurity-prod
  labels:
    app: movesecurity-prod
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/oci-load-balancer-tls-secret: ca-certificate-secret-movesecurity
    service.beta.kubernetes.io/oci-load-balancer-tls-backendset-secret: ca-certificate-secret-movesecurity
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "100"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "500"
spec:
  loadBalancerIP: "146.235.31.246"
  type: LoadBalancer
  selector:
    app: movesecurity-prod
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
